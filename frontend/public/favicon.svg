<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="favBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Left Pillar -->
    <linearGradient id="favLeft" x1="16" y1="14" x2="24" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Diagonal Ribbon -->
    <linearGradient id="favRibbon" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#a78bfa" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Right Pillar -->
    <linearGradient id="favRight" x1="40" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Community Orbital Ring -->
    <linearGradient id="favOrbit" x1="6" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#favBorder)" stroke-width="1.5" />

  <!-- Community Orbit Ring -->
  <ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(-28 32 32)" stroke="url(#favOrbit)" stroke-width="2" stroke-dasharray="2 3 14 2" />

  <!-- Vector N Geometric Mark -->
  <!-- Left Stem -->
  <path d="M17 15C17 14.45 17.45 14 18 14H23C23.55 14 24 14.45 24 15V49C24 49.55 23.55 50 23 50H18C17.45 50 17 49.55 17 49V15Z" fill="url(#favLeft)" />
  
  <!-- Diagonal Ribbon -->
  <path d="M20 15L43.5 48.5C43.9 49.1 44.7 49.2 45.2 48.8L46.5 47.8C47.1 47.4 47.2 46.6 46.8 46.1L24 14.5C23.6 13.9 22.8 13.8 22.3 14.2L20.5 15.2C20.2 15.4 20 15.7 20 16V15Z" fill="url(#favRibbon)" />
  
  <!-- Right Stem -->
  <path d="M40 15C40 14.45 40.45 14 41 14H46C46.55 14 47 14.45 47 15V49C47 49.55 46.55 50 46 50H41C40.45 50 40 49.55 40 49V15Z" fill="url(#favRight)" />

  <!-- Signal Star Accents -->
  <circle cx="18" cy="15" r="2.5" fill="#ffffff" />
  <circle cx="46" cy="49" r="2.5" fill="#38bdf8" />
  <circle cx="47" cy="16" r="2" fill="#f43f5e" />
</svg>
